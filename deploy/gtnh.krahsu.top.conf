server {
    listen 80;
    listen [::]:80;
    server_name gtnh.krahsu.top;
    return 301 https://gtnh.krahsu.top$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gtnh.krahsu.top;
    ssl_certificate /www/sites/blog.krahsu.top/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/blog.krahsu.top/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 20m;

    # Only room APIs receive browser credentials, to validate the IAM owner.
    # Neither the public app nor its dataset proxy ever receives this cookie.
    location ^~ /api/rooms {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 3m;
        proxy_read_timeout 30s;
    }

    location = /live {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Client-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /live/health {
        proxy_pass http://127.0.0.1:8793;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }

    location ^~ /live/ { return 404; }

    # A public planner: no IAM auth_request on the application or assets.
    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This public tool has no server session. Keep shared IAM credentials
        # out of the app and its upstream dataset proxy.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
